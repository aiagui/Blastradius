name: Release

# Pushing a tag like v0.2.1 creates the GitHub release. The package is not
# published to npm; install it from this repository. See CONTRIBUTING.md,
# "Releasing".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so origin/main is available below
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Only tag commits that are already merged."
            exit 1
          fi
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Require every GitHub Actions check-run on this commit to have succeeded.
          mapfile -t lines < <(gh api --paginate             "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"             --jq '.check_runs[] | select(.app.slug=="github-actions") | "\(.name)\t\(.status)\t\(.conclusion)"')
          if [ "${#lines[@]}" -eq 0 ]; then
            echo "::error::No GitHub Actions check runs found for this commit."
            exit 1
          fi
          bad=0
          for line in "${lines[@]}"; do
            IFS=$'\t' read -r name status conclusion <<<"$line"
            echo "$name: $status/$conclusion"
            if [ "$status" != "completed" ]; then
              echo "::error::$name is still $status"
              bad=1
            elif [ "$conclusion" != "success" ] && [ "$conclusion" != "skipped" ] && [ "$conclusion" != "neutral" ]; then
              echo "::error::$name concluded $conclusion"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry for $version."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
