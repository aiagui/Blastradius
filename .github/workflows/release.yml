name: Release

# Pushing a tag like v0.1.0 publishes that version to npm and creates the
# GitHub release. The publish job runs in the `npm` environment (add required
# reviewers there). It authenticates with npm trusted publishing (OIDC) once
# that is configured on npmjs.com, and falls back to the NPM_TOKEN secret
# until then. See CONTRIBUTING.md, "Releasing".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so origin/main is available below
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Only tag commits that are already merged."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds.
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run fixtures
      - name: Canary smoke test (offline, output must not contain CANARY)
        run: |
          out="$(node dist/cli.js --dir .fixtures/canary --offline --no-color 2>&1)"
          if grep -q 'CANARY' <<<"$out"; then
            echo "::error::A canary secret value reached the CLI output."
            exit 1
          fi
          echo "Canary run clean: $(grep -c '●' <<<"$out") findings, no CANARY in the output."
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Install npm 11
        run: |
          npm install -g --ignore-scripts npm@^11.5.1
          v="$(npm --version)"
          echo "npm $v"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1);
          ' "$v" || { echo "::error::npm $v is older than 11.5.1."; exit 1; }
      # npm uses OIDC when a trusted publisher is configured and only falls
      # back to NODE_AUTH_TOKEN otherwise, so the secret can be removed later
      # without touching this file.
      # --ignore-scripts: the checks and the build already ran above, so no
      # package script (or devDependency code) runs while the token is set.
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry for $version."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
