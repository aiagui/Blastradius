name: Release

# Pushing a tag like v0.1.0 publishes that version to npm and creates the
# GitHub release. The publish job runs in the `npm` environment (add required
# reviewers there) and needs an npm automation token in its NPM_TOKEN secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds.
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run fixtures
      - name: Canary smoke test (offline, output must not contain CANARY)
        run: |
          out="$(node dist/cli.js --dir .fixtures/canary --offline --no-color 2>&1)"
          if grep -q 'CANARY' <<<"$out"; then
            echo "::error::A canary secret value reached the CLI output."
            exit 1
          fi
          echo "Canary run clean: $(grep -c '●' <<<"$out") findings, no CANARY in the output."
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      # --ignore-scripts: the checks and the build already ran above, so no
      # package script (or devDependency code) runs while the token is set.
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry for $version."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
