version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # @types/node follows the oldest supported Node (engines), not the latest.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Packages that must move together get one PR, majors included.
    # A dependency joins the first group it matches.
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
